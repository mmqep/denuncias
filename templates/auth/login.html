{% extends "base_public.html" %}
{% block title %}Acceso interno · MMQEP{% endblock %}
{% block body %}
<main class="wrap section narrow">
  <div class="card form-card centro">
    <h1 class="page-title">Ingreso institucional</h1>
    <p class="muted">Credenciales de usuarios autorizados de la MMQEP.</p>
    <form method="post" action="{{ url_for('admin_denuncias.admin_login_post') }}" class="stack-form">
      <label>Correo institucional
        <input type="email" name="correo" required autocomplete="username" maxlength="160">
      </label>
      <label>Contraseña
        <input type="password" name="password" required autocomplete="current-password">
      </label>
      <button type="submit" class="btn btn-primary btn-block">Ingresar</button>
    </form>
    <p class="centro-muted"><a href="{{ url_for('public_denuncias.index') }}">← Volver al portal ciudadano</a></p>
  </div>
</main>
{% endblock %}
